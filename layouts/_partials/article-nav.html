{{ if or .PrevInSection .NextInSection }}
<nav class="article-nav" aria-label="Article navigation">
  <div>{{ with .PrevInSection }}<span>Previous</span><a href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ end }}</div>
  <div class="article-nav-next">{{ with .NextInSection }}<span>Next</span><a href="{{ .RelPermalink }}">{{ .Title }} →</a>{{ end }}</div>
</nav>
{{ end }}
